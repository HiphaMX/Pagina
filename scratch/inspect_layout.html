<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inspect Salsas</title>
  <style>
    body {
      background-color: #0D0B0B;
      color: white;
      font-family: sans-serif;
      margin: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
      background-color: #111;
    }
    img {
      max-width: 100%;
      height: 300px;
      object-fit: contain;
      background-color: #0D0B0B; /* dark background like website */
    }
  </style>
</head>
<body>
  <h1>Inspect Salsas JPEGs on Dark Background</h1>
  <div class="grid">
    <div class="card">
      <h3>Salsa Chile de Árbol</h3>
      <img src="../projects/ChileChillon/web/Assets/Salsas/Salsa Chile de Árbol.jpeg" alt="Árbol">
    </div>
    <div class="card">
      <h3>Salsa Habanero Tatemado</h3>
      <img src="../projects/ChileChillon/web/Assets/Salsas/Salsa Habanero Tatemado.jpeg" alt="Tatemado">
    </div>
    <div class="card">
      <h3>Salsa Habanero</h3>
      <img src="../projects/ChileChillon/web/Assets/Salsas/Salsa Habanero.jpeg" alt="Habanero">
    </div>
    <div class="card">
      <h3>Salsa Negra</h3>
      <img src="../projects/ChileChillon/web/Assets/Salsas/Salsa Negra.jpeg" alt="Negra">
    </div>
    <div class="card">
      <h3>Salsa Serrano</h3>
      <img src="../projects/ChileChillon/web/Assets/Salsas/Salsa Serrano.jpeg" alt="Serrano">
    </div>
  </div>
</body>
</html>
